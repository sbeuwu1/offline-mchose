name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Portable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}") {
            $rawVer = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_name }}" -like "v*") {
            $rawVer = "${{ github.ref_name }}"
          } else {
            $rawVer = "v1.0.0"
          }
          $verNumber = $rawVer.TrimStart('v')
          Write-Host "Raw Tag: $rawVer, Version Number: $verNumber"
          "version_tag=$rawVer" >> $env:GITHUB_OUTPUT
          "version_number=$verNumber" >> $env:GITHUB_OUTPUT

      - name: Publish Portable Executable
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version_number }}"
          dotnet publish src/MchoseHub/MchoseHub.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$ver `
            -o publish/portable

      - name: Stage Portable Binary
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version_number }}"
          Copy-Item "publish/portable/MchoseHub.exe" -Destination "publish/portable/OfflineMchose-Portable-v$ver.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer/mchose_setup.iss "/DMyAppVersion=$ver"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Mchose-Binaries-${{ steps.get_version.outputs.version_tag }}
          path: |
            publish/portable/OfflineMchose-Portable-*.exe
            publish/installer/MchoseHub-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_version.outputs.version_tag }}
          name: "Offline Mchose ${{ steps.get_version.outputs.version_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/portable/OfflineMchose-Portable-*.exe
            publish/installer/MchoseHub-Setup-*.exe
